{% extends "base.html" %}
{% block title %}{{ 'Editar' if proyecto else 'Nuevo' }} proyecto formativo · Generador SENA{% endblock %}
{% block content %}
<section class="page-head">
  <div><h1>{{ 'Editar proyecto formativo' if proyecto else 'Nuevo proyecto formativo' }}</h1></div>
  <div class="page-head__actions"><a class="btn btn-secondary" href="{{ url_for('project_list') }}">Volver</a></div>
</section>
<form method="post" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <section class="panel">
    <div class="field-grid">
      <div class="field"><label>Programa de formación</label>
        <select name="programa_id" required>
          <option value="">Seleccione…</option>
          {% set selected_programa = proyecto.programa_id if proyecto else request.args.get('programa_id','') %}
          {% for p in programas %}<option value="{{ p.id }}" {% if p.id == selected_programa %}selected{% endif %}>{{ p.codigo }} · {{ p.denominacion }}</option>{% endfor %}
        </select>
      </div>
      <div class="field"><label>Código SOFIA</label><input name="codigo_sofia" value="{{ proyecto.codigo_sofia if proyecto else '' }}"/></div>
      <div class="field"><label>Nombre del proyecto</label><input name="nombre" value="{{ proyecto.nombre if proyecto else '' }}" required/></div>
      <div class="field"><label>Centro de formación</label><input name="centro_formacion" value="{{ proyecto.centro_formacion if proyecto else '' }}"/></div>
      <div class="field"><label>Regional</label><input name="regional" value="{{ proyecto.regional if proyecto else '' }}"/></div>
      <div class="field"><label>Tiempo estimado (meses)</label><input name="tiempo_meses" type="number" step="0.5" value="{{ proyecto.tiempo_meses if proyecto else 0 }}"/></div>
      <div class="field"><label>Total resultados</label><input name="total_resultados" type="number" value="{{ proyecto.total_resultados if proyecto else 0 }}"/></div>
      <div class="field"><label>Empresas / instituciones</label><input name="empresas" value="{{ proyecto.empresas if proyecto else '' }}"/></div>
    </div>
    <div class="field"><label>Palabras clave</label><input name="palabras_clave" value="{{ proyecto.palabras_clave if proyecto else '' }}"/></div>
    <div class="field"><label>Planteamiento del problema</label><textarea name="planteamiento" rows="3">{{ proyecto.planteamiento if proyecto else '' }}</textarea></div>
    <div class="field"><label>Justificación</label><textarea name="justificacion" rows="3">{{ proyecto.justificacion if proyecto else '' }}</textarea></div>
    <div class="field"><label>Objetivo general</label><textarea name="objetivo_general" rows="2">{{ proyecto.objetivo_general if proyecto else '' }}</textarea></div>
    <div class="field"><label>Objetivos específicos</label><textarea name="objetivos_especificos" rows="3">{{ proyecto.objetivos_especificos if proyecto else '' }}</textarea></div>
    <div class="field"><label>Alcance</label><textarea name="alcance" rows="3">{{ proyecto.alcance if proyecto else '' }}</textarea></div>
    <div class="field"><label>Innovación / gestión tecnológica</label><textarea name="innovacion" rows="2">{{ proyecto.innovacion if proyecto else '' }}</textarea></div>
    <div class="field"><label>Valoración productiva</label><textarea name="valoracion" rows="2">{{ proyecto.valoracion if proyecto else '' }}</textarea></div>
    <div class="field"><label>Fuente</label><input name="fuente" value="{{ proyecto.fuente if proyecto else '' }}"/></div>
  </section>
  <div class="form-actions"><button class="btn btn-primary" type="submit">Guardar proyecto</button></div>
</form>
{% endblock %}
